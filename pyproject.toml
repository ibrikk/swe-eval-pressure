[project]
name = "swe-eval-pressure-runtime"
version = "0.1.0"
description = "Pinned host runtime for the SWE-EvalPressure benchmark harness"
requires-python = ">=3.13,<3.14"
dependencies = [
  "harbor[modal]==0.20.0",
  "xlsxwriter==3.2.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]
inference = [
    "matplotlib>=3.10,<4",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
    "statsmodels>=0.14.6",
]
